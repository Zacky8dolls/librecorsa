name: Build Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Build
        run: |
          sed -i 's|output: "export",|output: "export",\n  trailingSlash: true,|' next.config.ts
          npm ci
          rm -rf public/press
          NEXT_PUBLIC_ONLINE_API= npm run build
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "org.librecorsa.app",
            "appName": "LibreCorsa",
            "webDir": "out",
            "backgroundColor": "#08090D",
            "server": { "androidScheme": "https" }
          }
          EOF
          npm i -D @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' $M
          S=android/app/src/main/res/values/styles.xml
          sed -i 's|</style>|<item name="android:windowFullscreen">true</item></style>|' $S
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LibreCorsa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
